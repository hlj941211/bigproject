<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigProject - 欢迎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* animated background */
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(99, 102, 241, 0.15), transparent 50%),
                        radial-gradient(circle at 70% 20%, rgba(168, 85, 247, 0.1), transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.1), transparent 50%);
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -1%) rotate(1deg); }
            66% { transform: translate(-1%, 2%) rotate(-1deg); }
        }

        .card {
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 48px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .emoji {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .features {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 36px;
        }

        .feature {
            flex: 1;
            min-width: 100px;
            padding: 16px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.2s, background 0.2s;
        }

        .feature:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
        }

        .feature .icon { font-size: 28px; margin-bottom: 8px; }
        .feature .label { font-size: 13px; color: rgba(255, 255, 255, 0.7); }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 50px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">🚀</div>
        <h1>BigProject</h1>
        <p class="tagline">
            Build big. Ship fast.<br>
            一个小项目的起点，一切皆有可能。
        </p>

        <div class="features">
            <div class="feature">
                <div class="icon">⚡</div>
                <div class="label">极速开发</div>
            </div>
            <div class="feature">
                <div class="icon">🧩</div>
                <div class="label">模块化</div>
            </div>
            <div class="feature">
                <div class="icon">🌍</div>
                <div class="label">开放生态</div>
            </div>
        </div>

        <a href="https://github.com/hlj941211/bigproject" class="btn" target="_blank">
            ⭐ GitHub
        </a>

        <div class="footer">
            Powered by OpenClaw &copy; 2026
        </div>
    </div>

</body>
</html>
